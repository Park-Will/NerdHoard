{% extends 'base.html' %}

{% block content %}
<h2>Add a Book</h2>
<form method="POST">
  {% csrf_token %} {{form.as_p}}
  <button type="submit">Save</button>
</form>

<h2>Book List</h2>
<ul>
{% for book in books %}
    <li>
	{{book.title}} by {{book.author}} ({{book.condition}})
	<a href="{% url 'edit_book' book.id %}">Edit</a>
	<a href="{% url 'delete_book' book.id %}">Delete</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
