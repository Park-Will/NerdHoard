{% extends 'base.html' %}

{% block content %}
<h2>Add a Video Game</h2>
<form method="POST">
  {% csrf_token %} {{form.as_p}}
  <button type="submit">Save</button>
</form>

<h2>Video Game List</h2>
<ul>
{% for videogame in videogame %}
    <li>
        {{videogame.title}} by {{videogame.developer}} ({{videogame.condition}})
        <a href="{% url 'edit_book' book.id %}">Edit</a>
        <a href="{% url 'delete_book' book.id %}">Delete</a>
    </li>
  {% endfor %}
</ul>
{% endblock %}
